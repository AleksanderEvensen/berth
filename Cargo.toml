[workspace]
resolver = "2"
members = [
    "apps/berth",
    "crates/ui",
    "crates/docker",
    "crates/terminal",
    "crates/settings",
    "crates/window-chrome",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
berth-ui = { path = "crates/ui" }
berth-docker = { path = "crates/docker" }
berth-terminal = { path = "crates/terminal" }
berth-settings = { path = "crates/settings" }
gpui-window-chrome = { path = "crates/window-chrome" }

# gpui — the published `gpui-pre` snapshot of zed, which is what GPUI Kit's
# `gpui-base` is built against. Keep these three versions in lockstep.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "wayland",
    "x11",
    "font-kit",
] }
# Behaviour-only foundations (inputs, focus, virtual lists, popovers). We style
# everything ourselves in crates/ui.
gpui-base = "=0.7.1"
# Reading the native macOS window buttons' frames; versions match gpui-pre-macos.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
raw-window-handle = "0.6"
# Moving and zooming the window from our Windows titlebar; the version
# matches gpui-pre-windows.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

alacritty_terminal = "0.26"
anyhow = "1"
futures = "0.3"
futures-timer = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Platform config directory for settings.json (XDG on Linux).
dirs = "7"
sha2 = "0.10"
tempfile = "3"
mockito = "1"
env_logger = "0.11"
log = "0.4"
# Retain the /system/df wire shape used by Docker 23–28 and Podman.
# Docker 29 still returns these fields; Bollard 0.20+ uses incompatible stubs.
bollard = { version = "=0.19.4", features = ["chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# TLS client config for Bollard's custom transport: only the context's
# ca.pem is trusted (Bollard's built-in TLS also trusts public roots).
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
num-traits = "0.2"
aho-corasick = "1"
# Colour-space maths for theme tokens (oklch → sRGB).
palette = { version = "0.7", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0

# gpui is very slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"

# CI checks correctness without paying for interactive performance or debug info.
# Use the same profile for Clippy, builds, and tests to share compilation artifacts.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
