[package]
name = "berth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native desktop app for managing your Docker or Podman engine"
repository = "https://github.com/AleksanderEvensen/berth"
homepage = "https://github.com/AleksanderEvensen/berth"
authors = ["Aleksander Evensen <ahse03@gmail.com>"]
keywords = ["docker", "podman", "container", "compose", "image", "volume"]

[dependencies]
berth-ui.workspace = true
berth-docker.workspace = true
berth-terminal.workspace = true
berth-settings.workspace = true
gpui-window-chrome.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-base.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
chrono.workspace = true
aho-corasick.workspace = true
num-traits.workspace = true
# Files: the Downloads folder to save to.
dirs.workspace = true

[build-dependencies]
# The icon resource in the Windows executable; the version matches gpui-pre's.
embed-resource = "3.0.12"

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# Snapshots of painted elements' roles and labels, for the accessibility tests.
gpui-base = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[package.metadata.packager]
product-name = "Berth"
identifier = "no.ahse.berth"
long-description = """\
Berth is a fast, native desktop app for the container engine you already \
run. It connects to Docker or Podman through DOCKER_HOST, Docker contexts \
or the default sockets; it does not ship a runtime or a VM."""
category = "DeveloperTool"
license-file = "../../LICENSE"
icons = ["packaging/icons/*.png"]
# The Linux formats; `just package` picks `app` on macOS.
formats = ["deb", "appimage", "pacman"]
before-packaging-command = "just before-packaging"
out-dir = "../../target/packager"

# The .dmg is built, signed and notarized by `just package` around the .app.
[package.metadata.packager.macos]
# gpui's floor; keep in step with MACOSX_DEPLOYMENT_TARGET in the justfile.
minimum-system-version = "10.15.7"

# Desktop entry fields with no Cargo or cargo-packager key.
[package.metadata.desktop]
generic-name = "Container Manager"

[package.metadata.packager.linux]
generate-desktop-entry = false

# The binary links xcb and xkbcommon and opens libwayland-client and the
# Vulkan loader at runtime, so both are listed.
[package.metadata.packager.deb]
section = "devel"
depends = [
    "libc6 (>= 2.39)",
    "libgcc-s1",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libvulkan1",
    "hicolor-icon-theme",
]

[package.metadata.packager.deb.files]
"../../target/packaging/linux/no.ahse.berth.desktop" = "usr/share/applications/no.ahse.berth.desktop"
"packaging/icons/no.ahse.berth.svg" = "usr/share/icons/hicolor/scalable/apps/no.ahse.berth.svg"
"../../LICENSE" = "usr/share/doc/berth/copyright"

# The AppImage's desktop entry must be named after the binary.
[package.metadata.packager.appimage.files]
"../../target/packaging/linux/no.ahse.berth.desktop" = "usr/share/applications/berth.desktop"
"packaging/icons/no.ahse.berth.svg" = "usr/share/icons/hicolor/scalable/apps/no.ahse.berth.svg"

# The pacman format is only used for its .tar.gz: the same usr/ tree as the
# .deb, to unpack under / or ~/.local. The PKGBUILD it also writes is not
# released, so it has no depends or source.
[package.metadata.packager.pacman.files]
"../../target/packaging/linux/no.ahse.berth.desktop" = "usr/share/applications/no.ahse.berth.desktop"
"packaging/icons/no.ahse.berth.svg" = "usr/share/icons/hicolor/scalable/apps/no.ahse.berth.svg"
"../../LICENSE" = "usr/share/licenses/berth/LICENSE"
