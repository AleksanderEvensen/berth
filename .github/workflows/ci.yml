name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - name: Install Rust formatting tools
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: just fmt-check

  check:
    name: Lint, build, and test
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - name: Install Rust linting tools
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libssl-dev libvulkan-dev
      # Keep compilation on one runner: Clippy checks without linking, then the
      # build prepares both the application and test binaries for the test step.
      - name: Lint all targets
        run: just lint-ci
      - name: Build application and test targets
        run: just build-ci
      - name: Run unit tests and doctests
        run: just test-ci
