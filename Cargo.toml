[workspace]
resolver = "2"
members = [
    "apps/berth",
    "crates/ui",
    "crates/docker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
berth-ui = { path = "crates/ui" }
berth-docker = { path = "crates/docker" }

# gpui — the published `gpui-pre` snapshot of zed, which is what GPUI Kit's
# `gpui-base` is built against. Keep these three versions in lockstep.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "wayland",
    "x11",
    "font-kit",
] }
# Behaviour-only foundations (inputs, focus, virtual lists, popovers). We style
# everything ourselves — see docs/plan/04-design-system.md.
gpui-base = "=0.7.1"

anyhow = "1"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
env_logger = "0.11"
log = "0.4"
bollard = { version = "0.21.1", features = ["ssl", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

[profile.dev]
opt-level = 0

# gpui is very slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"

# CI checks correctness without paying for interactive performance or debug info.
# Use the same profile for Clippy, builds, and tests to share compilation artifacts.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
