[package]
name = "berth-docker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Engine contract, domain model, grouping logic and fixtures. Live clients
# implement `engine::Engine` behind this crate's API.
[dependencies]
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
num-traits.workspace = true
futures-timer.workspace = true
bollard = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

[dev-dependencies]
# The integration tests' direct client may need TLS for a tcp:// DOCKER_HOST.
bollard = { workspace = true, features = ["ssl"] }
tempfile.workspace = true
mockito.workspace = true

[features]
default = ["live"]
live = ["dep:bollard", "dep:tokio", "dep:tokio-util", "dep:chrono", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:rustls-pki-types", "dep:http", "dep:tower-service", "dep:tar"]

[lints]
workspace = true
