[workspace]
resolver = "2"
members = [
    "apps/berth",
    "crates/ui",
    "crates/docker",
    "crates/terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
berth-ui = { path = "crates/ui" }
berth-docker = { path = "crates/docker" }
berth-terminal = { path = "crates/terminal" }

# gpui — the published `gpui-pre` snapshot of zed, which is what GPUI Kit's
# `gpui-base` is built against. Keep these three versions in lockstep.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "wayland",
    "x11",
    "font-kit",
] }
# Behaviour-only foundations (inputs, focus, virtual lists, popovers). We style
# everything ourselves — see docs/plan/04-design-system.md.
gpui-base = "=0.7.1"

alacritty_terminal = "0.26"
anyhow = "1"
futures = "0.3"
futures-timer = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
mockito = "1"
env_logger = "0.11"
log = "0.4"
# Retain the /system/df wire shape used by Docker 23–28 and Podman.
# Docker 29 still returns these fields; Bollard 0.20+ uses incompatible stubs.
# `webpki`: rustls with ring and bundled roots, so connecting never depends
# on the system trust store (Docker TLS trusts the daemon's own ca.pem).
bollard = { version = "=0.19.4", features = ["ssl", "webpki", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
num-traits = "0.2"
aho-corasick = "1"
# Colour-space maths for theme tokens (oklch → sRGB).
palette = { version = "0.7", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0

# gpui is very slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"

# CI checks correctness without paying for interactive performance or debug info.
# Use the same profile for Clippy, builds, and tests to share compilation artifacts.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
