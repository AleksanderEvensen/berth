[package]
name = "gpui-window-chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Client-side window chrome for gpui: resizable frame, titlebar drag and native-looking caption buttons"
keywords = ["gpui", "titlebar", "csd", "window-decorations", "gtk"]

[dependencies]
gpui.workspace = true
log.workspace = true
num-traits.workspace = true

# GTK 3 is opened at runtime, never linked; image filters its drawings.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libloading = "0.8"
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
